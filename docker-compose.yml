services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${FALKORDB_PORT:-6379}:6379"      # graph
      - "${FALKORDB_UI_PORT:-3000}:3000"   # FalkorDB browser UI (override if 3000 is taken)
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional: run the API in Docker too (`docker compose --profile api up`). Locally `make run` is simpler.
  api:
    build: .
    profiles: ["api"]
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    ports:
      - "8000:8000"
    volumes:
      - ./cache:/app/cache
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb_data:
